[package]
name = "job-command-center"
version = "0.1.4"
edition = "2021"
description = "A native workspace that turns job postings into honest, tailored applications."
license = "MIT"

[dependencies]
slint = "1.18"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
open = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2", "gzip", "brotli", "deflate", "json", "stream"] }
scraper = "0.27"
regex = "1"
url = "2"
keyring = "4"
sha2 = "0.11"
hex = "0.4"
ed25519-dalek = "2"
semver = "1"
futures-util = { version = "0.3", default-features = false }
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
pdf-extract = "0.12.1"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }
arboard = "3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
qrcode = { version = "0.14", default-features = false }
getrandom = "0.3"
ngrok = { version = "0.19", default-features = false, features = ["aws-lc-rs"] }
candle-core = { version = "0.9.2", default-features = false }
candle-nn = { version = "0.9.2", default-features = false }
candle-transformers = { version = "0.9.2", default-features = false }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

# macOS: set the Dock icon when the app runs outside its .app bundle (developer builds).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }

[package.metadata.packager]
product-name = "Job Command Center"
identifier = "com.jobcommandcenter.desktop"
publisher = "Job Command Center"
category = "Productivity"
description = "Turns job postings into honest, tailored applications, on your own computer."
icons = ["assets/icon.png", "assets/icon.icns", "assets/icon.ico"]
out-dir = "dist"
before-packaging-command = "cargo build --release"
binaries = [{ path = "job-command-center", main = true }]

[package.metadata.packager.macos]
minimum-system-version = "11.0"

[package.metadata.packager.deb]
depends = ["libxkbcommon0", "libfontconfig1", "libdbus-1-3"]

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Debug builds: no incremental cache and no full debug info. Both multiply the size of
# target/ (it reached 24 GB) for little benefit here; line tables still give useful backtraces.
[profile.dev]
incremental = false
debug = "line-tables-only"

# Dependencies (typst, candle) are far too slow unoptimised; keep debug builds usable.
[profile.dev.package."*"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false

[profile.release]
lto = "thin"
strip = true
