<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3A3E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B2629" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#0F3A3E">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Job Command Center">
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<title>Job Command Center</title>
<style>
@font-face { font-family: "Bricolage Grotesque"; src: url("/fonts/BricolageGrotesque.ttf") format("truetype"); font-weight: 200 800; font-display: swap; }
@font-face { font-family: "Atkinson Hyperlegible Next"; src: url("/fonts/AtkinsonHyperlegibleNext.ttf") format("truetype"); font-weight: 200 800; font-display: swap; }

/* ---------- tokens (mirror app/ui/theme.slint) ---------- */
:root {
  --rail: #0F3A3E; --rail-ink: #E8F1EF; --rail-muted: #8FB3AE; --rail-active: #1A5257;
  --paper: #EEF2F0; --surface: #FFFFFF; --sunken: #E4EAE7;
  --ink: #0F2A2E; --muted: #55706F; --faint: #8EA3A1; --line: #D3DDDA;
  --accent: #0F7A66; --accent-soft: #D7EEE8; --selected: #E2EEEA; --on-accent: #FFFFFF;
  --marigold: #E3A83B; --marigold-soft: #FCEFD3; --marigold-ink: #8A5A0B;
  --risk: #B4413C; --risk-soft: #F8E1DE; --good: #1F8F63; --good-soft: #DCF0E6;
  --shadow: 0 1px 2px rgba(15,42,46,.06), 0 4px 16px rgba(15,42,46,.06);
  --shadow-up: 0 -1px 0 var(--line), 0 -6px 24px rgba(15,42,46,.06);
  --display: "Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --body: "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-ticket: 16px; --r-panel: 12px; --r-control: 8px;
  --tabbar: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --rail: #0B2629; --rail-active: #154347;
    --paper: #111B1C; --surface: #182425; --sunken: #142021;
    --ink: #E7EFED; --muted: #93A8A5; --faint: #637A78; --line: #263738;
    --accent: #4FC1A6; --accent-soft: #173A35; --selected: #1F3233; --on-accent: #0B2629;
    --marigold-soft: #3A2E14; --marigold-ink: #F2C66E;
    --risk: #F08A80; --risk-soft: #3A1F1D; --good: #5ED39E; --good-soft: #163327;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    --shadow-up: 0 -1px 0 var(--line);
    color-scheme: dark;
  }
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.45 var(--body); -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ico { display: inline-flex; width: 22px; height: 22px; flex: none; }
.ico svg { width: 100%; height: 100%; }

/* ---------- buttons & fields ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: var(--r-control);
       border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--selected); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { background: var(--risk); border-color: var(--risk); color: #fff; }
@media (prefers-color-scheme: dark) { .btn.danger { color: #2a0f0d; } }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding: 0 10px; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn.block { width: 100%; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; transform: none; filter: none; }
.btn .ico { width: 18px; height: 18px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font-size: 14px; font-weight: 700; color: var(--muted); }
.input, .select, .textarea { width: 100%; min-height: 46px; padding: 10px 12px; border-radius: var(--r-control); border: 1px solid var(--line);
       background: var(--surface); font-size: 16px; color: var(--ink); }
.textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.select { appearance: none; -webkit-appearance: none; padding-right: 36px; cursor: pointer;
          background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
          background-position: calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.hint { font-size: 14px; color: var(--muted); }

/* ---------- PIN screen ---------- */
#login { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: calc(24px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) calc(24px + var(--safe-b)) calc(16px + env(safe-area-inset-left, 0px));
         background: radial-gradient(120% 70% at 50% 0%, #1A5257 0%, var(--rail) 60%); color: var(--rail-ink); }
.login-card { width: 100%; max-width: 380px; display: grid; gap: 22px; justify-items: center; text-align: center; }
.login-card img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
.login-card h1 { font-size: 30px; font-weight: 800; }
.login-card .lead { color: var(--rail-muted); font-size: 16px; max-width: 30ch; }
.pin { display: grid; gap: 8px; width: 100%; max-width: 336px; text-align: left; }
.pin label { font-weight: 700; color: var(--rail-ink); font-size: 15px; }
.pin input { width: 100%; height: 60px; border-radius: 12px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.2); color: #fff;
             font: 700 26px var(--display); letter-spacing: .08em; text-align: center; padding: 0 12px; }
.pin input::placeholder { color: rgba(255,255,255,.28); }
.pin input:focus { outline: none; border-color: var(--marigold); box-shadow: 0 0 0 4px rgba(227,168,59,.25); }
.pin p { color: var(--rail-muted); font-size: 14px; text-align: center; }
.pin.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.login-error { min-height: 24px; color: #FFB4AB; font-weight: 700; }
.login-card .btn.primary { background: var(--marigold); border-color: var(--marigold); color: #2B1D02; width: 100%; max-width: 336px; min-height: 52px; font-size: 17px; }
.login-foot { color: var(--rail-muted); font-size: 14px; }

/* ---------- shell ---------- */
#app { min-height: 100vh; }
.rail { display: none; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top, 0px)) calc(8px + env(safe-area-inset-right, 0px)) 8px calc(16px + env(safe-area-inset-left, 0px));
          background: var(--rail); color: var(--rail-ink); min-height: 56px; }
.topbar img { width: 28px; height: 28px; border-radius: 8px; }
.topbar .brand { font: 700 18px var(--display); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 420px) { .topbar:has(.working-pill) .brand { visibility: hidden; } }
.icon-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: inherit; cursor: pointer; }
.icon-btn:hover { background: rgba(127,127,127,.15); }
.working-pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px 4px 8px; border-radius: 999px; background: rgba(255,255,255,.12); font-size: 13px; font-weight: 700; white-space: nowrap; }
main { padding: 16px calc(16px + env(safe-area-inset-right, 0px)) calc(var(--tabbar) + 96px + var(--safe-b)) calc(16px + env(safe-area-inset-left, 0px)); max-width: 1120px; margin: 0 auto; }
.tabbar { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; height: calc(var(--tabbar) + var(--safe-b)); padding: 0 env(safe-area-inset-right, 0px) var(--safe-b) env(safe-area-inset-left, 0px);
          display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); box-shadow: var(--shadow-up); }
.tabbar a { display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--muted); text-decoration: none; font-size: 12.5px; font-weight: 700; position: relative; }
.tabbar a .ico { width: 24px; height: 24px; }
.tabbar a[aria-current="page"] { color: var(--accent); }
.tabbar a[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.badge { position: absolute; top: 5px; left: calc(50% + 9px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; box-shadow: 0 0 0 2px var(--surface); background: var(--marigold); color: #2B1D02; font-size: 12px; font-weight: 800; display: grid; place-items: center; }
.fab { position: fixed; z-index: 31; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(var(--tabbar) + 16px + var(--safe-b)); width: 60px; height: 60px; border-radius: 20px; border: 0;
       background: var(--accent); color: var(--on-accent); box-shadow: 0 6px 20px rgba(15,58,62,.35); display: grid; place-items: center; cursor: pointer; }
.fab .ico { width: 30px; height: 30px; }
.fab:active { transform: scale(.96); }

@media (min-width: 900px) {
  #app { display: grid; grid-template-columns: 236px 1fr; }
  .topbar, .tabbar, .fab { display: none; }
  .rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; padding: 20px 14px; background: var(--rail); color: var(--rail-ink); }
  .rail .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 20px; font: 800 18px/1.15 var(--display); }
  .rail .brand img { width: 36px; height: 36px; border-radius: 10px; }
  .rail nav { display: grid; gap: 4px; }
  .rail nav a { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px; border-radius: 10px; color: var(--rail-muted); text-decoration: none; font-weight: 700; }
  .rail nav a:hover { background: rgba(255,255,255,.06); color: var(--rail-ink); }
  .rail nav a[aria-current="page"] { background: var(--rail-active); color: var(--rail-ink); }
  .rail nav a .count { margin-left: auto; background: var(--marigold); color: #2B1D02; border-radius: 10px; font-size: 12px; padding: 1px 8px; font-weight: 800; }
  .rail .add { margin: 16px 0 8px; background: var(--marigold); border-color: var(--marigold); color: #2B1D02; }
  .rail .spacer { flex: 1; }
  .rail .working-pill { align-self: flex-start; margin: 0 8px 12px; }
  .rail .signout { color: var(--rail-muted); justify-content: flex-start; padding: 0 12px; }
  .rail .signout:hover { background: rgba(255,255,255,.06); color: var(--rail-ink); }
  main { padding: 36px 40px 64px; width: 100%; min-width: 0; }
}

/* ---------- common bits ---------- */
.page-head { display: grid; gap: 6px; margin: 4px 0 18px; }
.page-head .eyebrow { color: var(--accent); font-weight: 700; font-size: 15px; }
.page-head h1 { font-size: clamp(28px, 7.4vw, 40px); font-weight: 800; line-height: 1.08; letter-spacing: -0.02em; }
.page-head .sub { color: var(--muted); font-size: 16px; }
.page-head .head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.card h2 { font-size: 19px; font-weight: 700; }
.card h3 { font-size: 15px; font-family: var(--body); font-weight: 700; color: var(--muted); }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r-panel); font-size: 15px; margin-bottom: 16px; }
.banner .ico { width: 20px; height: 20px; margin-top: 1px; }
.banner.warn { background: var(--marigold-soft); color: var(--marigold-ink); }
.banner.risk { background: var(--risk-soft); color: var(--risk); }
.banner .grow { flex: 1; min-width: 0; }
.mono { flex: none; display: grid; place-items: center; width: var(--s, 40px); height: var(--s, 40px); border-radius: calc(var(--s, 40px) * .28);
        background: var(--ml); color: #fff; font: 700 calc(var(--s, 40px) * .46) / 1 var(--display); }
@media (prefers-color-scheme: dark) { .mono { background: var(--md); } }
.mono.inverted { background: #fff; color: var(--ml); }
.flag { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 13px; font-weight: 700; white-space: nowrap; background: var(--accent-soft); color: var(--accent); }
.flag.Boarding { background: var(--marigold-soft); color: var(--marigold-ink); }
.flag.Delayed, .flag.Stopped { background: var(--risk-soft); color: var(--risk); }
.score { font: 700 17px var(--display); white-space: nowrap; }
.score small { font: 400 12px var(--body); color: var(--faint); margin-left: 2px; }
.score.none { color: var(--faint); }
.good { color: var(--good); } .mid { color: var(--marigold-ink); } .bad { color: var(--risk); }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.working { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); font-size: 14px; font-weight: 700; min-width: 0; }
.working span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-ticket); overflow: hidden; }
.list-head { background: var(--rail); color: var(--rail-muted); font-size: 13px; font-weight: 700; padding: 12px 16px; display: flex; justify-content: space-between; }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); display: grid; gap: 14px; justify-items: center; }
.empty strong { color: var(--ink); font: 700 19px var(--display); }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
.pager .where { color: var(--muted); font-size: 14px; text-align: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; min-height: 30px; padding: 4px 12px; border-radius: 15px; background: var(--sunken); font-size: 14px; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--risk-soft); color: var(--risk); }
.chip.mid { background: var(--marigold-soft); color: var(--marigold-ink); }
.bullets { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.bullets li { position: relative; padding-left: 20px; }
.bullets li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--faint)); }
.skel { height: 76px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, transparent, var(--sunken), transparent) 0 0 / 200% 100%; animation: shimmer 1.2s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .search { flex: 1 1 220px; position: relative; }
.toolbar .search .ico { position: absolute; left: 12px; top: 12px; width: 20px; height: 20px; color: var(--faint); pointer-events: none; }
.toolbar .search .input { padding-left: 40px; }
.toolbar .select { flex: 0 1 200px; width: auto; }
.toolbar .btn { flex: none; }

/* ---------- rows ---------- */
.swipe { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
.swipe:last-child { border-bottom: 0; }
.swipe-act { position: absolute; top: 0; right: 0; bottom: 0; width: 104px; border: 0; background: var(--risk); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; display: grid; place-items: center; gap: 2px; }
@media (prefers-color-scheme: dark) { .swipe-act { color: #2a0f0d; } }
.row { position: relative; display: flex; gap: 12px; align-items: center; padding: 14px 16px; min-height: 76px; background: var(--surface); cursor: pointer; touch-action: pan-y;
       transition: transform .2s ease; color: inherit; text-decoration: none; }
.row:hover { background: var(--selected); }
.row.selected { background: var(--accent-soft); }
.row .main { flex: 1; min-width: 0; display: grid; gap: 3px; }
.row .title { font-weight: 700; font-size: 16.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.row .meta { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .reason { font-size: 14px; color: var(--muted); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .side { display: grid; justify-items: end; gap: 6px; flex: none; }
.row .when { flex: none; width: 64px; font: 700 17px/1.15 var(--display); }
.row .when.Delayed { color: var(--risk); } .row .when.today { color: var(--marigold-ink); }
.row .when-col { display: none; }
.row .when-inline { width: auto; font-size: 14px; line-height: 1.2; }
.today-row { align-items: flex-start; }
.today-row .mono { margin-top: 2px; }
.row .bottom { display: flex; align-items: center; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
.row .quick { display: none; }
@media (hover: hover) and (pointer: fine) {
  .row .quick { display: inline-flex; visibility: hidden; }
  .row:hover .quick, .row:focus-within .quick { visibility: visible; }
}
.check { flex: none; width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--faint); display: grid; place-items: center; color: var(--on-accent); background: var(--surface); }
.check.on { background: var(--accent); border-color: var(--accent); }
.check .ico { width: 16px; height: 16px; }
.today-row .company { font-size: 14px; font-weight: 700; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
@media (min-width: 700px) {
  .today-row { align-items: center; }
  .today-row .mono { margin-top: 0; }
  .row .when-col { display: block; width: 92px; font-size: 20px; }
  .row .when-inline { display: none; }
  .app-row .side { min-width: 150px; }
}
.select-bar { position: fixed; z-index: 32; left: 0; right: 0; bottom: calc(var(--tabbar) + var(--safe-b)); display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--rail); color: var(--rail-ink); box-shadow: 0 -6px 24px rgba(0,0,0,.18); }
.select-bar .n { flex: 1; font-weight: 700; }
.select-bar .btn.ghost { color: var(--rail-ink); }
@media (min-width: 900px) { .select-bar { left: 236px; bottom: 0; padding: 14px 40px; } }
.disc-row { display: grid; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.disc-row:last-child { border-bottom: 0; }
.disc-row .top { display: flex; gap: 12px; align-items: flex-start; }
.disc-row .acts { display: flex; gap: 8px; flex-wrap: wrap; padding-left: 52px; }
.disc-row .acts .btn { flex: 1 1 auto; }
@media (min-width: 700px) { .disc-row { grid-template-columns: 1fr auto; align-items: center; } .disc-row .acts { padding-left: 0; flex-wrap: nowrap; } .disc-row .acts .btn { flex: none; } }

/* ---------- track ---------- */
.track { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); --dot: 14px; --cur: 22px; --cy: 14px; padding-top: 0; }
.track .leg { position: absolute; top: calc(var(--cy) - 3px); height: 6px; border-radius: 3px; background: var(--line); }
.track .leg.done { background: var(--c); }
.track.ended .leg.done { background: var(--faint); }
.track .stop { display: grid; justify-items: center; gap: 6px; min-width: 0; position: relative; }
.track .dot { width: var(--dot); height: var(--dot); margin-top: calc(var(--cy) - var(--dot) / 2); border-radius: 50%; background: var(--surface); border: 3px solid var(--line); position: relative; z-index: 1; }
.track .done .dot { border-color: var(--c); }
.track.ended .done .dot { border-color: var(--faint); }
.track .cur .dot { width: var(--cur); height: var(--cur); margin-top: calc(var(--cy) - var(--cur) / 2); border: 0; background: var(--marigold); box-shadow: 0 0 0 7px rgba(227,168,59,.28); }
.track.ended .cur .dot { background: var(--risk); box-shadow: none; color: #fff; display: grid; place-items: center; font: 700 15px/1 var(--body); }
.track .lbl { font-size: 12.5px; line-height: 1.2; text-align: center; color: var(--faint); padding: 0 1px; overflow-wrap: normal; hyphens: none; }

.track.on-dark .lbl { color: rgba(255,255,255,.5); }
.track.on-dark .done .lbl { color: rgba(255,255,255,.78); }
.track.on-dark .cur .lbl { color: #fff; }
.track.on-dark .cur .dot { background: var(--marigold); border: 0; }

.track.compact .leg { height: 4px; top: calc(var(--cy) - 2px); }
.track.compact .dot { border-width: 2px; }
.track.compact .cur .dot { box-shadow: 0 0 0 3px rgba(227,168,59,.3); font-size: 0; }

/* ---------- application page ---------- */
.back { display: inline-flex; align-items: center; gap: 4px; margin: -6px 0 10px -10px; }

<section id="login" hidden>

             enterkeyhint="go" aria-describedby="login-error pin-help">

    </div>

</section>

<div id="app" hidden>

</div>

<div id="layer"></div>

<script>
'use strict';
/* =====================================================================
   Job Command Center: web companion. Vanilla JS, no build step.
   All data is inserted with textContent / DOM nodes (never innerHTML);
   innerHTML is only used for the constant SVG icons below.
   ===================================================================== */

// ---------------------------------------------------------------- constants
const STAGES = ['Found', 'Fit checked', 'Tailored', 'Applied', 'Interview', 'Offer'];
const STAGE_COLORS = ['#8592A0', '#3B7DD8', '#7A5AF0', '#1F9D6E', '#E3A83B', '#E4572E'];

const AI_OFF = "Your AI isn't connected. Open Job Command Center on your computer → Settings to connect it.";

const S = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICONS = {
  today: S('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  apps: S('<path d="M3 7h2M3 12h2M3 17h2M8 7h13M8 12h13M8 17h13"/>'),

  check: S('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  search: S('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'),
  signout: S('<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/>'),
  ext: S('<path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>'),
  copy: S('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>'),
  star: S('<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>'),
  starOn: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
  warn: S('<path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17.5v.5"/>'),

  gear: S('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  doc: S('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>'),
};

// ---------------------------------------------------------------- state
const state = {
  me: null,                 // { name, working, ai_connected }
  route: { view: 'today' },
  today: null,              // { date, items }
  apps: { status: 'Active', q: '', page: 0, data: null, selecting: false, selected: new Set() },
  disc: { country: '', q: '', page: 0, data: null },
  job: null,                // JobDetail of the open application
  jobError: null,
  viewError: null,
  profile: { data: null, form: null, dirty: false, saving: false, section: 'about' },
  settings: { data: null, form: null, dirty: false },
  closeReasons: null,
  drafts: {},               // unsaved form text, keyed so polling never wipes it
  asking: {},               // jobId -> question while /ask is pending
  busy: new Set(),          // keys of buttons with a request in flight
  navDepth: 0,
  pollTimer: null,
  lastSig: '',

// ---------------------------------------------------------------- DOM helpers
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style') for (const [sk, sv] of Object.entries(v)) el.style.setProperty(sk, sv);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') el[k] = v;
      else el.setAttribute(k, v === true ? '' : String(v));
    }
  }
  append(el, kids);
  return el;
}
function append(el, kids) {
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false || k === '') continue;
    el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return el;
}
function icon(name) { const s = document.createElement('span'); s.className = 'ico'; s.innerHTML = ICONS[name]; return s; } // constant SVG only
const $ = (sel, root = document) => root.querySelector(sel);

function btn(label, opts = {}) {
  const { kind = '', onclick, disabled, ico, small, title, type = 'button', busyKey, block } = opts;
  const busy = busyKey && state.busy.has(busyKey);
  const cls = ['btn', kind, small && 'small', block && 'block'].filter(Boolean).join(' ');
  return h('button', { class: cls, type, title, disabled: disabled || busy, 'aria-busy': busy ? 'true' : null, onclick },

  return h('a', { class: cls, href, target: '_blank', rel: 'noopener noreferrer' }, opts.ico && icon(opts.ico), label);
}

// ---------------------------------------------------------------- API
class ApiError extends Error {
  constructor(status, message, data) { super(message); this.status = status; this.data = data || {}; }
}
async function api(path, body) {
  const post = body !== undefined;
  const opt = { method: post ? 'POST' : 'GET', credentials: 'same-origin', headers: { Accept: 'application/json' } };
  if (post) { opt.headers['X-JCC'] = '1'; opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  let res;
  try { res = await fetch(path, opt); }
  catch { throw new ApiError(0, "Can't reach your computer. Check that Job Command Center is open and you're on the same Wi-Fi."); }

  document.addEventListener('keydown', onKey);
  sheetClose = () => { document.removeEventListener('keydown', onKey); };
  setTimeout(() => { const f = sheet.querySelector('input, select, textarea, button:not([disabled])'); if (f && !isTouch()) f.focus(); else sheet.focus(); }, 30);
  sheet.tabIndex = -1;
}
function closeSheet() {
  if (sheetClose) sheetClose();
  sheetClose = null;
  $('#layer').replaceChildren();
  document.body.style.overflow = '';
  if (sheetReturnFocus && sheetReturnFocus.isConnected) try { sheetReturnFocus.focus({ preventScroll: true }); } catch { /* ignore */ }
  sheetReturnFocus = null;
}

// -- Close one or many
async function getCloseReasons(jobs) {
  if (state.closeReasons) return state.closeReasons;
  if (Array.isArray(state.me?.close_reasons) && state.me.close_reasons.length) return (state.closeReasons = state.me.close_reasons);
  try {
    const j = await api(`/api/jobs/${jobs[0].id}`);
    if (Array.isArray(j.close_reasons) && j.close_reasons.length) state.closeReasons = j.close_reasons;
  } catch (e) { if (e.status === 401) throw e; }
  return state.closeReasons || DEFAULT_CLOSE_REASONS;
}
async function openCloseSheet(jobs) {
  if (!jobs.length) return;
  let reasons;
  try { reasons = await getCloseReasons(jobs); } catch { return; }
  const f = { reason: reasons[0], note: '', busy: false };
  const many = jobs.length > 1;
  openSheet((close, paint) => [
    h('h2', null, many ? `Close ${jobs.length} applications` : 'Close this application'),
    !many && h('p', { style: { 'font-weight': '700' } }, `${jobs[0].title}`, h('span', { class: 'hint', style: { 'font-weight': '400' } }, ` · ${jobs[0].company}`)),
    h('p', { class: 'hint' }, 'It stays in your history. If the same job turns up again, the app will tell you.'),
    h('label', { class: 'field' }, h('span', null, 'Why are you closing ' + (many ? 'them' : 'it') + '?'),
      h('select', { class: 'select', onchange: (e) => { f.reason = e.target.value; } }, reasons.map((r) => h('option', { value: r, selected: r === f.reason }, r)))),
    h('label', { class: 'field' }, h('span', null, 'Note (optional)'),
      h('textarea', { class: 'textarea', rows: 2, value: f.note, oninput: (e) => { f.note = e.target.value; } })),
    h('div', { class: 'actions' },
      btn('Cancel', { onclick: close }),
      h('button', { class: 'btn danger', type: 'button', disabled: f.busy, onclick: async () => {
        f.busy = true; paint();
        try {
          const ids = jobs.map((x) => x.id);
          if (many) await api('/api/jobs/close', { ids, reason: f.reason, note: f.note });
          else await api(`/api/jobs/${ids[0]}/close`, { reason: f.reason, note: f.note });
          close();
          state.apps.selecting = false; state.apps.selected.clear();
          toast(many ? `Closed ${ids.length} applications.` : 'Closed.', { action: 'Undo', onAction: () => undoClose(ids) });
          await refresh(true);
        } catch (e) {
          f.busy = false; paint();
          if (e.status !== 401) toast(e.message, { error: true });
        }
      } }, f.busy && h('span', { class: 'spinner' }), many ? 'Close them' : 'Close it')),
  ], 'Close applications');
}
async function undoClose(ids) {
  try {
    await Promise.all(ids.map((id) => api(`/api/jobs/${id}/reopen`, {})));
    toast(ids.length > 1 ? 'Reopened them.' : 'Reopened.');
  } catch (e) { if (e.status !== 401) toast(e.message, { error: true }); }
  refresh(true);
}

// -- Add a job
function openAddSheet() {
  const f = { url: '', text: '', showText: false, busy: false, dup: null, error: '' };
  const submit = async (force, paint, close) => {
    const url = f.url.trim();
    if (!/^https?:\/\/\S+\.\S+/i.test(url)) { f.error = 'Paste the full link to the posting. It starts with https://'; paint(); return; }
    f.busy = true; f.error = ''; paint();
    try {
      const body = { url, text: f.text };
      if (force) body.force = true;
      const res = await api('/api/jobs', body);
      close();
      toast('Added. The agents are reading the posting.');
      state.navDepth++; location.hash = `#/job/${res.id}`;
    } catch (e) {
      f.busy = false;
      if (e.status === 401) return;
      if (e.status === 409 && e.data && e.data.duplicate_of != null) f.dup = { id: e.data.duplicate_of, msg: e.message };
      else f.error = e.message;
      paint();
    }
  };
  openSheet((close, paint) => [
    h('h2', null, 'Add a job'),
    h('p', { class: 'hint' }, 'Paste the link to the job posting. The agents read it, check the fit and tailor your resume.'),
    !aiOn() && h('p', { class: 'ai-note' }, "Your AI isn't connected, so the job is saved but nobody reads it until you connect it on your computer."),
    h('label', { class: 'field' }, h('span', null, 'Link to the posting'),
      h('input', { class: 'input', type: 'url', inputmode: 'url', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: 'https://', value: f.url, 'data-k': 'add-url',
        oninput: (e) => { f.url = e.target.value; if (f.error || f.dup) { f.error = ''; f.dup = null; paint(); const i = $('[data-k="add-url"]'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); } },
        onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(false, paint, close); } } })),
    f.showText
      ? h('label', { class: 'field' }, h('span', null, 'Job description (optional)'),
          h('textarea', { class: 'textarea', rows: 5, value: f.text, placeholder: 'Paste it if the page needs a login to read.', oninput: (e) => { f.text = e.target.value; } }))
      : btn('Paste the description too', { kind: 'ghost small', onclick: () => { f.showText = true; paint(); } }),
    f.error && h('p', { class: 'ai-note', role: 'alert', style: { color: 'var(--risk)' } }, f.error),
    f.dup && h('div', { class: 'dup', role: 'alert' },
      h('strong', null, 'You’ve seen this job before'),
      (() => { const rest = f.dup.msg.replace(/^you['’]ve seen this job before[:.…]*\s*/i, ''); return rest && h('p', null, rest); })(),
      h('div', { class: 'actions' },
        btn('Open the earlier one', { kind: 'primary', onclick: () => { close(); openJob(f.dup.id); } }),
        btn('Add it anyway', { disabled: f.busy, onclick: () => submit(true, paint, close) }))),
    !f.dup && h('div', { class: 'actions' },
      btn('Cancel', { onclick: close }),
      h('button', { class: 'btn primary', type: 'button', disabled: f.busy, onclick: () => submit(false, paint, close) }, f.busy && h('span', { class: 'spinner' }), f.busy ? 'Adding…' : 'Add job')),
  ], 'Add a job');
}

// ---------------------------------------------------------------- boot
async function boot() {
  try { await loadMe(); }
  catch (e) {
    if (e.status === 401) return; // showLogin already ran
    $('#login').hidden = false; setLoginError(e.message); return;
  }
  $('#login').hidden = true;
  $('#app').hidden = false;
  state.route = parseRoute();
  renderShell();
  renderView();
  await refresh();
}
initLogin();
initShell();
// Installable app: the service worker only registers over HTTPS or on localhost, so failures are expected on plain http.
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
window.addEventListener('hashchange', onRoute);
boot();
</script>
